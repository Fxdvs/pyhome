# Runs the whole test suite on every push and pull request,
# on the two systems pyhome runs on and on the oldest and newest Python it supports.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # one failing system must not hide how the others did
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the tests
        # -ra lists skipped tests with the reason, so a missing tkinter is visible
        run: python -m pytest -v -ra
